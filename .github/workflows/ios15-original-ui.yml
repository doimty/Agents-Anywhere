name: iOS 15 original interface

# Builds the original application target (no Legacy replacement app). A source
# inventory never substitutes for a successful Xcode build.
on:
  push:
    branches: [fix/ios/ios15-original-ui]
    paths:
      - "ios/**"
      - ".github/workflows/ios15-original-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios15-original-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  original-ui:
    name: Original app at iOS 15 floor
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record the selected compiler and SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          mkdir -p "$RUNNER_TEMP/original-ui"
          {
            git rev-parse HEAD
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun swift --version
          } | tee "$RUNNER_TEMP/original-ui/toolchain.txt"
      - name: Cache Swift package builds
        uses: actions/cache@v4
        with:
          path: ios/.build
          key: original-ios15-xcode266-${{ github.sha }}
      - name: Type-check portable SwiftUI adapters at iOS 15
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          compat="ios/Agents Anywhere/Agents Anywhere/Views/Compatibility"
          xcrun swiftc -typecheck -swift-version 5 -default-isolation MainActor \
            -target arm64-apple-ios15.0 -sdk "$sdk" \
            "$compat/AppSwiftUICompatibility.swift" \
            "$compat/AppNavigationCompatibility.swift" \
            "$compat/AppPhotoCompatibility.swift" \
            > "$RUNNER_TEMP/original-ui/adapters.log" 2>&1
      - name: Build the original app for an iOS 15 device
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/original-ui"
          set +e
          xcodebuild \
            -project "ios/Agents Anywhere/Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > "$evidence/device-build.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$evidence/device-build-exit.txt"
          python3 ios/scripts/summarize_ios15_build.py "$evidence/device-build.log" \
            --exit-code "$status" --output "$evidence/diagnostics.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Test original state and scheduling semantics
        # Full logs exposed obsolete test bindings and mutating macro inputs.
        # These are corrected; compilation and runtime cases now gate packaging.
        timeout-minutes: 15
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +e
          xcrun swift test --package-path ios \
            > "$RUNNER_TEMP/original-ui/core-tests.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/original-ui/core-tests-exit.txt"
          tail -n 40 "$RUNNER_TEMP/original-ui/core-tests.log" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Exercise native and backport drawer and long conversation
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/scripts/run_compatibility_ui_tests.py \
            --evidence "$RUNNER_TEMP/original-ui" \
            --derived-data "$RUNNER_TEMP/SimDerivedData"
      - name: Upload all compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ui-ios15-${{ github.sha }}
          path: |
            ${{ runner.temp }}/original-ui/*.txt
            ${{ runner.temp }}/original-ui/*.log
            ${{ runner.temp }}/original-ui/*.json
            ${{ runner.temp }}/original-ui/*.png
            ${{ runner.temp }}/original-ui/screenshots/**
          if-no-files-found: warn
          retention-days: 14
      - name: Package the unsigned iOS 15 IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/DeviceDerivedData/Build/Products/Debug-iphoneos"
          app="$products/Agents Anywhere.app"
          test -f "$app/Info.plist" || { ls -la "$products"; exit 1; }
          floor="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")"
          test "$floor" = '15.0'
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          xcrun vtool -show-build "$app/$exe" | tee "$RUNNER_TEMP/original-ui/macho.txt"
          otool -L "$app/$exe" | tee "$RUNNER_TEMP/original-ui/dependencies.txt"
          mkdir -p "$RUNNER_TEMP/original-ui/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/original-ui/ipa/Payload/"
          (
            cd "$RUNNER_TEMP/original-ui/ipa"
            zip -qry AgentsAnywhere-ios15-unsigned.ipa Payload
            shasum -a 256 AgentsAnywhere-ios15-unsigned.ipa > SHA256SUMS
            ls -lh AgentsAnywhere-ios15-unsigned.ipa
          )
          python3 ios/scripts/verify_ios15_ipa.py \
            "$RUNNER_TEMP/original-ui/ipa/AgentsAnywhere-ios15-unsigned.ipa" \
            --expected-build 19 --report "$RUNNER_TEMP/original-ui/ipa-verification.json"
      - name: Upload the IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AgentsAnywhere-ios15-unsigned-ipa
          path: |
            ${{ runner.temp }}/original-ui/ipa/AgentsAnywhere-ios15-unsigned.ipa
            ${{ runner.temp }}/original-ui/ipa/SHA256SUMS
            ${{ runner.temp }}/original-ui/macho.txt
            ${{ runner.temp }}/original-ui/dependencies.txt
            ${{ runner.temp }}/original-ui/ipa-verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload state regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/original-ui/core-tests.log
            ${{ runner.temp }}/original-ui/core-tests-exit.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload complete UI test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-xcresult-${{ github.sha }}
          path: ${{ runner.temp }}/original-ui/CompatibilityUI.xcresult
          if-no-files-found: warn
          retention-days: 14
